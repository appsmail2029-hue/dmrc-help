name: Build & Release Metro Assist APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetroAssist-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: "Metro Assist Release ${{ github.ref_name || 'v1.0.0' }}"
          draft: false
          prerelease: false
          body: |
            ### Metro Assist - Delhi Metro Divyangjan Assistance System
            Official Android APK build for Delhi Metro Pink Line inter-station coordination.

            - **App Version:** 1.0.0
            - **Platform:** Android 7.0+ (API 24 - 36)
            - **Package ID:** `com.aistudio.metroassist.pkstn`
